<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Tracker Pro — Zihao Wang</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2333; --fg:#e6edf3; --muted:#8b98a9;
  --accent:#4f8bff; --accent2:#7c5cff; --good:#34d399; --warn:#fbbf24; --bad:#f87171;
  --border:#2a3550; --chip:#222d44;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;line-height:1.55;min-height:100vh;display:flex}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
/* ---- Sidebar ---- */
.side{width:220px;min-width:220px;background:var(--panel);border-right:1px solid var(--border);padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .brand{font-size:1.05em;font-weight:700;padding:6px 10px 16px;border-bottom:1px solid var(--border);margin-bottom:10px;color:var(--fg)}
.side .brand small{display:block;font-size:.68em;color:var(--muted);font-weight:400;margin-top:3px}
.nav-btn{display:flex;align-items:center;gap:8px;background:transparent;border:none;color:var(--muted);padding:9px 10px;border-radius:8px;cursor:pointer;font-size:.9em;text-align:left;width:100%}
.nav-btn:hover{background:var(--panel2);color:var(--fg)}
.nav-btn.active{background:#14224a;color:#7f9cff;font-weight:600}
.nav-btn .cnt{margin-left:auto;background:var(--chip);border-radius:10px;padding:0 7px;font-size:.75em;color:var(--muted)}
.nav-btn.active .cnt{color:#7f9cff}
.side .foot{margin-top:auto;padding:12px 10px 4px;font-size:.72em;color:var(--muted);border-top:1px solid var(--border)}
/* ---- Main ---- */
.main{flex:1;min-width:0;padding:22px 26px 70px}
.viewhead{border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:18px}
.viewhead h1{font-size:1.35em}
.viewbody{}
/* ---- KPI ---- */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.k-num{font-size:1.65em;font-weight:700}
.k-lbl{font-size:.78em;color:var(--muted);margin-top:2px}
.k-sub{font-size:.7em;color:var(--muted);opacity:.8}
/* ---- Panels ---- */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.panel-head h3{font-size:.95em;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.link{font-size:.8em}
/* ---- Stage bar ---- */
.stage-bar{display:flex;gap:6px}
.stage{flex:1;text-align:center}
.stage-track{position:relative;height:34px;background:var(--panel2);border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:.85em;font-weight:700}
.stage-fill{position:absolute;left:0;top:0;bottom:0;background:var(--sg);opacity:.35}
.stage-track span{position:relative;z-index:1}
.stage-lbl{font-size:.68em;color:var(--muted);margin-top:4px}
/* ---- Rows ---- */
.row3{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--border);font-size:.9em}
.row3:last-child{border-bottom:none}
.row3.clickable{cursor:pointer} .row3.clickable:hover{background:var(--panel2)}
.r3-rank{color:var(--accent);font-weight:700;min-width:30px}
.r3-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r3-date{color:var(--muted);font-size:.8em;min-width:60px}
/* ---- Pipeline / Kanban ---- */
.pipeline-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.search{flex:1;min-width:200px;background:var(--panel);border:1px solid var(--border);color:var(--fg);padding:9px 13px;border-radius:8px;font-size:.9em}
.search::placeholder{color:var(--muted)}
.search:focus{outline:none;border-color:var(--accent)}
.btn{background:var(--panel);border:1px solid var(--border);color:var(--fg);padding:9px 14px;border-radius:8px;font-size:.88em;cursor:pointer;transition:.12s}
.btn:hover{background:var(--panel2);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.8em}
.btn.active-ph{background:var(--accent);border-color:var(--accent);color:#fff}
.muted-sm{color:var(--muted);font-size:.8em}
.kanban{display:grid;grid-template-columns:repeat(6,minmax(190px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px}
.kan-col{background:var(--panel);border:1px solid var(--border);border-radius:10px;min-height:300px;display:flex;flex-direction:column}
.kan-col.over{border-color:var(--accent);background:#14224a33}
.kan-head{display:flex;align-items:center;gap:7px;padding:10px 12px;font-size:.85em;font-weight:600;border-bottom:1px solid var(--border)}
.kan-dot{width:8px;height:8px;border-radius:50%;background:var(--pc)}
.kan-count{margin-left:auto;background:var(--chip);border-radius:10px;padding:0 7px;font-size:.75em}
.kan-body{padding:8px;display:flex;flex-direction:column;gap:7px;flex:1}
.app-card{background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;cursor:pointer;transition:.12s}
.app-card:hover{border-color:var(--accent)}
.app-card.dragging{opacity:.5}
.ac-title{font-weight:600;font-size:.88em}
.ac-job{font-size:.78em;color:var(--muted);margin-top:1px}
.ac-comp{font-size:.75em;color:var(--good);margin-top:3px}
.ac-foot{display:flex;justify-content:space-between;align-items:center;margin-top:7px}
.ac-date{font-size:.7em;color:var(--muted)}
.ac-tier{font-size:.68em;color:var(--accent)}
/* ---- Badges / chips ---- */
.phase-pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.72em;font-weight:600;background:color-mix(in srgb,var(--pc) 18%,transparent);color:var(--pc);border:1px solid color-mix(in srgb,var(--pc) 40%,transparent)}
.badge{padding:3px 10px;border-radius:20px;font-size:.72em;font-weight:600}
.s-new{background:#14224a;color:#7f9cff}
.s-prepping{background:#3a2b12;color:#fbbf24}
.s-applied{background:#113627;color:#34d399}
.s-followup{background:#3a1d50;color:#c084fc}
.s-closed{background:#3a2424;color:#f87171}
.chip{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.72em;background:var(--chip);color:var(--muted);border:1px solid var(--border)}
.rank{padding:2px 9px;border-radius:20px;font-size:.72em;font-weight:700;background:var(--chip);color:var(--accent)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:28px 16px;border:1px dashed var(--border);border-radius:10px;font-size:.88em}
.empty p{margin-top:5px;font-size:.8em}
/* ---- Companies grid ---- */
.toolbar2{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.co-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.co-card{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:14px;cursor:pointer;transition:.12s;display:flex;flex-direction:column;gap:6px}
.co-card:hover{border-color:var(--accent)}
.co-top{display:flex;justify-content:space-between;align-items:center}
.co-score{font-weight:700;color:var(--accent)}
.co-name{font-weight:600;font-size:1em}
.co-cat{color:var(--muted);font-size:.8em}
.co-meta{display:flex;gap:6px;flex-wrap:wrap}
.co-angle{font-size:.78em;color:var(--muted);opacity:.9;border-top:1px solid var(--border);padding-top:7px;margin-top:2px}
/* ---- Role list ---- */
.role-list{display:flex;flex-direction:column;gap:8px}
.role-row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer;transition:.12s}
.role-row:hover{border-color:var(--accent)}
.rr-fit{min-width:36px;height:36px;border-radius:9px;background:#14224a;color:#7f9cff;display:flex;align-items:center;justify-content:center;font-weight:700}
.rr-main{flex:1;min-width:0}
.rr-title{font-weight:600;font-size:.93em}
.rr-sub{font-size:.78em;color:var(--muted)}
.rr-meta{display:flex;gap:6px;flex-wrap:wrap;max-width:340px}
.rr-act{min-width:90px;text-align:right}
/* ---- Interviews ---- */
.iv-list{display:flex;flex-direction:column;gap:8px}
.iv-row{display:flex;align-items:center;gap:14px;background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:11px 13px}
.iv-date{min-width:80px;font-size:.88em}
.iv-time{font-size:.72em;color:var(--muted)}
.iv-main{flex:1}
.iv-title{font-weight:600;font-size:.9em}
.iv-sub{font-size:.78em;color:var(--muted)}
/* ---- Materials ---- */
.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;align-items:start}
.bl-list{display:flex;flex-direction:column;gap:7px}
.bl-row{display:flex;gap:9px;align-items:flex-start;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:.85em}
.bl-num{color:var(--accent);font-weight:700;min-width:20px}
.bl-text{flex:1}
.copy{background:transparent;border:1px solid var(--border);color:var(--muted);padding:3px 8px;border-radius:6px;cursor:pointer;font-size:.74em}
.copy:hover{color:var(--fg)}
/* ---- Sequences ---- */
.seq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.seq-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px}
.seq-title{font-weight:600}
.seq-sub{font-size:.8em;color:var(--muted);margin:2px 0 8px}
.seq-step{font-size:.82em;color:var(--muted);opacity:.9}
/* ---- Funnel ---- */
.funnel{display:flex;flex-direction:column;gap:8px}
.funnel-row{display:flex;align-items:center;gap:10px}
.f-label{font-size:.8em;color:var(--muted);text-align:right}
.f-bar{flex:1;height:20px;background:var(--panel2);border-radius:6px;overflow:hidden}
.f-fill{height:100%;border-radius:6px}
.f-num{min-width:24px;text-align:center;font-weight:700;font-size:.85em}
/* ---- Detail ---- */
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;margin:14px 0 10px}
.detail-head h2{font-size:1.25em}
.detail-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.phase-advance{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:12px 0}
.phase-advance span{font-size:.82em;color:var(--muted)}
.angle-text{font-size:.92em;line-height:1.7}
.tl{display:flex;flex-direction:column;gap:10px}
.tl-item{display:flex;gap:10px;align-items:flex-start;font-size:.88em}
.tl-dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0}
.tl-time{font-size:.72em;color:var(--muted)}
.rl{display:flex;flex-direction:column;gap:6px}
/* ---- Form / modal ---- */
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:.82em;color:var(--muted)}
.form input,.form select,.form textarea{background:var(--panel2);border:1px solid var(--border);color:var(--fg);padding:9px 11px;border-radius:8px;font-size:.9em}
.form input:focus,.form select:focus,.form textarea:focus{outline:none;border-color:var(--accent)}
.form .chk{flex-direction:row;align-items:center;gap:8px;font-size:.88em;color:var(--fg)}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:22px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
.modal-card h3{margin-bottom:14px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
/* ---- Toast ---- */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);color:var(--fg);padding:10px 20px;border-radius:10px;font-size:.88em;opacity:0;pointer-events:none;transition:.25s;z-index:100}
#toast.show{opacity:1}
@media(max-width:900px){.side{display:none}.dash-grid{grid-template-columns:1fr}.two-col{grid-template-columns:1fr}.kanban{grid-template-columns:repeat(3,minmax(180px,1fr))}}
@media(max-width:560px){.kanban{grid-template-columns:repeat(2,minmax(170px,1fr))}}
</style>
</head>
<body>
<aside class="side">
  <div class="brand">Job Tracker Pro<small>Zihao Wang · job campaign OS</small></div>
  <button class="nav-btn" data-view="dashboard">📊 Dashboard</button>
  <button class="nav-btn" data-view="pipeline">🗂 Pipeline <span class="cnt" id="cnt-pipeline"></span></button>
  <button class="nav-btn" data-view="companies">🏢 Companies <span class="cnt" id="cnt-companies"></span></button>
  <button class="nav-btn" data-view="roles">🔎 Job Search <span class="cnt" id="cnt-roles"></span></button>
  <button class="nav-btn" data-view="interviews">🎤 Interviews</button>
  <button class="nav-btn" data-view="materials">📄 Materials</button>
  <button class="nav-btn" data-view="outreach">✉️ Outreach</button>
  <button class="nav-btn" data-view="stats">📈 Stats</button>
  <button class="nav-btn" data-view="settings">⚙️ Settings</button>
  <div class="foot">local-only · data saved in this browser</div>
</aside>
<main class="main">
  <div id="app"><div class="empty">Loading…</div></div>
</main>
<script src="core.js"></script>
<script src="ui.js"></script>
<script src="views.js"></script>
<script src="actions.js"></script>
<script>
/* ---- Boot: seed + nav ---- */
(function boot(){
  // Optional: if a seeded-data file exists, offer import via UI. Auto-load fresh state if empty.
  document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.view)));
  window.addEventListener('hashchange',()=>{ renderRoute(); updateNavCounts(); });
  function updateNavCounts(){
    const c=phaseCounts();
    const inFlight=c.applied+c.screen+c.interview+c.offer;
    const el1=document.getElementById('cnt-pipeline'); if(el1) el1.textContent=inFlight||'';
    const el2=document.getElementById('cnt-companies'); if(el2) el2.textContent=(state.companies||[]).length||'';
    const el3=document.getElementById('cnt-roles'); if(el3) el3.textContent=(state.roles||[]).length||'';
  }
  window.updateNavCounts=updateNavCounts;
  if(!location.hash) location.hash='#/dashboard';
  renderRoute(); updateNavCounts();
})();
</script>
</body>
</html>
